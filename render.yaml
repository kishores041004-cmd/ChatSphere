services:
  # Spring Boot Backend Web Service
  - type: web
    name: kishore-chatsphere-backend
    env: docker
    rootDir: spring-boot-websocket-chat-demo-master
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080

  # Frontend Static Site
  - type: static
    name: kishore-chatsphere
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
